name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  CTEST_PARALLEL_LEVEL: 2
  DEPS_CACHE_VERSION: v3

jobs:
  metadata:
    name: Release Metadata
    runs-on: ubuntu-22.04
    outputs:
      entropy_version: ${{ steps.version.outputs.entropy_version }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test release security helpers
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_release*.py' -v

      - name: Verify release tag matches project version
        id: version
        run: |
          metadata_file=cmake/ProjectMetadata.cmake
          major=$(sed -nE 's/.*set\(VERSION_MAJOR[[:space:]]+([0-9]+)\).*/\1/p' "$metadata_file" | head -n 1)
          minor=$(sed -nE 's/.*set\(VERSION_MINOR[[:space:]]+([0-9]+)\).*/\1/p' "$metadata_file" | head -n 1)
          feature=$(sed -nE 's/.*set\(VERSION_FEATURE[[:space:]]+([0-9]+)\).*/\1/p' "$metadata_file" | head -n 1)
          patch=$(sed -nE 's/.*set\(VERSION_PATCH[[:space:]]+([0-9]+)\).*/\1/p' "$metadata_file" | head -n 1)
          if [[ -z "$major" || -z "$minor" || -z "$feature" || -z "$patch" ]]; then
            echo "Unable to parse VERSION_* values from $metadata_file" >&2
            exit 1
          fi

          version="$major.$minor.$feature.$patch"
          tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="v$version"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must be named like v0.9.5.0, got '$tag'" >&2
            exit 1
          fi
          if [[ "$tag" != "v$version" ]]; then
            echo "Release tag '$tag' does not match cmake/ProjectMetadata.cmake VERSION_FULL '$version'" >&2
            exit 1
          fi

          # Only reviewed main-branch history may be signed or released.
          git merge-base --is-ancestor HEAD refs/remotes/origin/main

          echo "entropy_version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "### Entropy release"
            echo
            echo "Tag: $tag"
            echo "Version: $version"
          } >> "$GITHUB_STEP_SUMMARY"

  windows-x86_64:
    name: Windows Release (x86_64)
    if: github.event_name == 'push'
    runs-on: windows-2022
    needs: metadata
    env:
      CMAKE_GENERATOR: "Visual Studio 17 2022"
      CMAKE_GENERATOR_PLATFORM: x64
      ENTROPY_VERSION: ${{ needs.metadata.outputs.entropy_version }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Map short workspace path
        run: 'subst S: "$env:GITHUB_WORKSPACE"'

      - name: Validate runner tools
        working-directory: 'S:\'
        run: |
          cmake --version
          git --version
          vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Get-Command candle.exe -ErrorAction Stop
          Get-Command light.exe -ErrorAction Stop

      - name: Restore Release Dependencies cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            build-release/external/catch2-*
            build-release/external/cli11-*
            build-release/external/cmakerc-*
            build-release/external/curl-*
            build-release/external/glfw-*
            build-release/external/glm-*
            build-release/external/iconfont-*
            build-release/external/imgui-*
            build-release/external/implot-*
            build-release/external/itk-*
            build-release/external/vtk-*
            build-release/external/nanovg-*
            build-release/external/nativefiledialog-*
            build-release/external/nlohmann_json-*
            build-release/external/qtbase-*
            build-release/external/spdlog-*
            build-release/external/stduuid-*
            build-release/external/tinyfsm-*
          key: >-
            entropy-release-${{ env.DEPS_CACHE_VERSION }}-windows-msvc2022-deps-${{ github.sha }}-${{
            hashFiles('CMakePresets.json', 'CMakeLists.txt', 'cmake/*.cmake', '.github/workflows/release.yml') }}

      - name: Configure Release Dependencies
        working-directory: 'S:\'
        run: cmake --preset deps-release

      - name: Build Release Dependencies
        working-directory: 'S:\'
        run: cmake --build --preset deps-release --parallel "$env:CMAKE_BUILD_PARALLEL_LEVEL"

      - name: Configure Release app
        working-directory: 'S:\'
        run: cmake --preset app-release

      - name: Build Release app
        working-directory: 'S:\'
        run: cmake --build --preset app-release --parallel "$env:CMAKE_BUILD_PARALLEL_LEVEL"

      - name: Run Release tests
        working-directory: 'S:\'
        run: ctest --test-dir build-release -C Release --parallel "$env:CTEST_PARALLEL_LEVEL" --output-on-failure

      - name: Build MSI and portable ZIP
        working-directory: 'S:\'
        run: cmake --build --preset package-release --parallel "$env:CMAKE_BUILD_PARALLEL_LEVEL"

      - name: Smoke-test staged install
        working-directory: 'S:\'
        run: |
          cmake --install build-release --config Release --prefix build-release\windows-package-install
          & .\build-release\windows-package-install\entropy.exe --help

      - name: Locate release assets
        working-directory: 'S:\'
        run: |
          $packageDir = "build-release\packages"
          $msi = Get-ChildItem $packageDir -Filter "Entropy-$env:ENTROPY_VERSION-Windows-*.msi" -File |
            Select-Object -First 1
          $zip = Get-ChildItem $packageDir -Filter "Entropy-$env:ENTROPY_VERSION-Windows-*-portable.zip" -File |
            Select-Object -First 1

          if (-not $msi) {
            throw "MSI package was not found in $packageDir"
          }
          if (-not $zip) {
            throw "Portable ZIP package was not found in $packageDir"
          }

          "MSI: $($msi.Name)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "Portable ZIP: $($zip.Name)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload Windows packages as workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: entropy-${{ env.ENTROPY_VERSION }}-windows-x86_64
          path: |
            build-release/packages/Entropy-${{ env.ENTROPY_VERSION }}-Windows-*.msi
            build-release/packages/Entropy-${{ env.ENTROPY_VERSION }}-Windows-*-portable.zip
          if-no-files-found: error

  linux-x86_64:
    name: Ubuntu 22.04 Release (x86_64)
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    needs: metadata
    env:
      CC: gcc-13
      CXX: g++-13
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 2G
      ENTROPY_VERSION: ${{ needs.metadata.outputs.entropy_version }}
      LINUX_PACKAGE_LABEL: Ubuntu

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y software-properties-common
          sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            ccache \
            gcc-13 \
            g++-13 \
            dpkg-dev \
            fakeroot \
            file \
            libdbus-1-dev \
            libssl-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            xorg-dev

      - name: Validate runner tools
        run: |
          lsb_release -a
          cmake --version
          cpack --version
          git --version
          "${CC}" --version
          "${CXX}" --version
          ccache --version
          dpkg-deb --version

      - name: Restore Release ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .ccache
          key: >-
            entropy-release-${{ env.DEPS_CACHE_VERSION }}-linux-ubuntu2204-gcc13-ccache-${{ github.sha }}-${{
            hashFiles('CMakePresets.json', 'CMakeLists.txt', 'cmake/*.cmake', '.github/workflows/release.yml') }}

      - name: Reset Release ccache stats
        run: |
          ccache --max-size="${CCACHE_MAXSIZE}"
          ccache --zero-stats

      - name: Restore Release Dependencies cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            build-release/external/catch2-*
            build-release/external/cli11-*
            build-release/external/cmakerc-*
            build-release/external/curl-*
            build-release/external/glfw-*
            build-release/external/glm-*
            build-release/external/iconfont-*
            build-release/external/imgui-*
            build-release/external/implot-*
            build-release/external/itk-*
            build-release/external/vtk-*
            build-release/external/nanovg-*
            build-release/external/nativefiledialog-*
            build-release/external/nlohmann_json-*
            build-release/external/qtbase-*
            build-release/external/spdlog-*
            build-release/external/stduuid-*
            build-release/external/tinyfsm-*
          key: >-
            entropy-release-${{ env.DEPS_CACHE_VERSION }}-linux-ubuntu2204-gcc13-deps-${{ github.sha }}-${{
            hashFiles('CMakePresets.json', 'CMakeLists.txt', 'cmake/*.cmake', '.github/workflows/release.yml') }}

      - name: Configure Release Dependencies
        run: >
          cmake --preset deps-release
          -DEntropy_SUPERBUILD_PARALLEL="${CMAKE_BUILD_PARALLEL_LEVEL}"
          -DEntropy_LINUX_PACKAGE_PLATFORM_LABEL="${LINUX_PACKAGE_LABEL}"

      - name: Build Release Dependencies
        run: cmake --build --preset deps-release --parallel "${CMAKE_BUILD_PARALLEL_LEVEL}"

      - name: Configure Release app
        run: cmake --preset app-release -DEntropy_LINUX_PACKAGE_PLATFORM_LABEL="${LINUX_PACKAGE_LABEL}"

      - name: Build Release app
        run: cmake --build --preset app-release --parallel "${CMAKE_BUILD_PARALLEL_LEVEL}"

      - name: Run Release tests
        run: ctest --test-dir build-release --parallel "${CTEST_PARALLEL_LEVEL}" --output-on-failure

      - name: Build DEB and portable TAR.GZ
        run: cmake --build --preset package-release --parallel "${CMAKE_BUILD_PARALLEL_LEVEL}"

      - name: Inspect DEB package
        run: |
          dpkg-deb --info build-release/packages/Entropy-${ENTROPY_VERSION}-${LINUX_PACKAGE_LABEL}-*.deb
          dpkg-deb --contents build-release/packages/Entropy-${ENTROPY_VERSION}-${LINUX_PACKAGE_LABEL}-*.deb

      - name: Smoke-test staged install
        run: |
          cmake --install build-release --prefix build-release/linux-package-install
          build-release/linux-package-install/bin/entropy --help

      - name: Locate release assets
        run: |
          package_dir="build-release/packages"
          deb=$(find "$package_dir" -maxdepth 1 -type f \
            -name "Entropy-${ENTROPY_VERSION}-${LINUX_PACKAGE_LABEL}-*.deb" | head -n 1)
          tarball=$(find "$package_dir" -maxdepth 1 -type f \
            -name "Entropy-${ENTROPY_VERSION}-${LINUX_PACKAGE_LABEL}-*-portable.tar.gz" | head -n 1)

          if [[ -z "$deb" ]]; then
            echo "DEB package was not found in $package_dir" >&2
            exit 1
          fi
          if [[ -z "$tarball" ]]; then
            echo "Portable TAR.GZ package was not found in $package_dir" >&2
            exit 1
          fi

          {
            echo "DEB: $(basename "$deb")"
            echo "Portable TAR.GZ: $(basename "$tarball")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Linux packages as workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: entropy-${{ env.ENTROPY_VERSION }}-ubuntu-x86_64
          path: |
            build-release/packages/Entropy-${{ env.ENTROPY_VERSION }}-Ubuntu-*.deb
            build-release/packages/Entropy-${{ env.ENTROPY_VERSION }}-Ubuntu-*-portable.tar.gz
          if-no-files-found: error

      - name: Show Release ccache stats
        if: always()
        run: ccache --show-stats

  macos-arm64:
    name: macOS Release (arm64)
    runs-on: macos-15
    needs: metadata
    environment: release-signing
    env:
      ENTROPY_VERSION: ${{ needs.metadata.outputs.entropy_version }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 2G
      ENTROPY_MACOS_ARCHITECTURES: arm64
      ENTROPY_MACOS_DEPLOYMENT_TARGET: "13.3"
      ENTROPY_MACOS_SUPERBUILD_PARALLEL: 2

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install build dependencies
        run: brew install ccache

      - name: Validate runner tools
        run: |
          sw_vers
          test "$(uname -m)" = "arm64"
          cmake --version
          cpack --version
          git --version
          ccache --version
          xcodebuild -version
          xcrun --show-sdk-version

      - name: Restore Release ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .ccache
          key: >-
            entropy-release-${{ env.DEPS_CACHE_VERSION }}-macos15-arm64-appleclang-ccache-${{ github.sha }}-${{
            hashFiles('CMakePresets.json', 'CMakeLists.txt', 'cmake/*.cmake', '.github/workflows/release.yml') }}

      - name: Reset Release ccache stats
        run: |
          ccache --max-size="${CCACHE_MAXSIZE}"
          ccache --zero-stats

      - name: Restore Release Dependencies cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            build-release/external/catch2-*
            build-release/external/cli11-*
            build-release/external/cmakerc-*
            build-release/external/glfw-*
            build-release/external/glm-*
            build-release/external/iconfont-*
            build-release/external/imgui-*
            build-release/external/implot-*
            build-release/external/itk-*
            build-release/external/vtk-*
            build-release/external/nanovg-*
            build-release/external/nativefiledialog-*
            build-release/external/nlohmann_json-*
            build-release/external/qtbase-*
            build-release/external/spdlog-*
            build-release/external/stduuid-*
            build-release/external/tinyfsm-*
          key: >-
            entropy-release-${{ env.DEPS_CACHE_VERSION }}-macos15-arm64-appleclang-deps-${{ github.sha }}-${{
            hashFiles('CMakePresets.json', 'CMakeLists.txt', 'cmake/*.cmake', '.github/workflows/release.yml') }}

      - name: Configure Release Dependencies
        run: >
          cmake --preset deps-release
          -DCMAKE_OSX_ARCHITECTURES="${ENTROPY_MACOS_ARCHITECTURES}"
          -DCMAKE_OSX_DEPLOYMENT_TARGET="${ENTROPY_MACOS_DEPLOYMENT_TARGET}"
          -DEntropy_SUPERBUILD_PARALLEL="${ENTROPY_MACOS_SUPERBUILD_PARALLEL}"

      - name: Build Release Dependencies
        run: cmake --build --preset deps-release --parallel 1

      - name: Configure Release app
        run: >
          cmake --preset app-release
          -DCMAKE_OSX_ARCHITECTURES="${ENTROPY_MACOS_ARCHITECTURES}"
          -DCMAKE_OSX_DEPLOYMENT_TARGET="${ENTROPY_MACOS_DEPLOYMENT_TARGET}"
          -DEntropy_MACOS_ICON_DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer
          -DEntropy_MACOS_CODESIGN_IDENTITY=-

      - name: Build Release app
        run: cmake --build --preset app-release --parallel "${CMAKE_BUILD_PARALLEL_LEVEL}"

      - name: Verify macOS dark icon
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
        run: python3 .github/scripts/verify_macos_icon_assets.py build-release/bin/Entropy.app/Contents/Resources/Assets.car

      - name: Run Release tests
        run: ctest --test-dir build-release --parallel "${CTEST_PARALLEL_LEVEL}" --output-on-failure

      - name: Validate deployment target
        run: otool -l build-release/bin/Entropy.app/Contents/MacOS/entropy | grep -A3 LC_BUILD_VERSION

      - name: Install Developer ID certificate and notarization key
        env:
          ENTROPY_MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.ENTROPY_MACOS_CERTIFICATE_P12_BASE64 }}
          ENTROPY_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.ENTROPY_MACOS_CERTIFICATE_PASSWORD }}
          ENTROPY_MACOS_CODESIGN_IDENTITY: ${{ secrets.ENTROPY_MACOS_CODESIGN_IDENTITY }}
          ENTROPY_NOTARY_API_KEY_BASE64: ${{ secrets.ENTROPY_NOTARY_API_KEY_BASE64 }}
          ENTROPY_NOTARY_API_KEY_ID: ${{ secrets.ENTROPY_NOTARY_API_KEY_ID }}
          ENTROPY_NOTARY_API_ISSUER_ID: ${{ secrets.ENTROPY_NOTARY_API_ISSUER_ID }}
        run: bash .github/scripts/setup_macos_release_credentials.sh

      - name: Configure Developer ID packaging
        env:
          ENTROPY_MACOS_CODESIGN_IDENTITY: ${{ secrets.ENTROPY_MACOS_CODESIGN_IDENTITY }}
        run: >
          cmake --preset app-release
          -DCMAKE_OSX_ARCHITECTURES="${ENTROPY_MACOS_ARCHITECTURES}"
          -DCMAKE_OSX_DEPLOYMENT_TARGET="${ENTROPY_MACOS_DEPLOYMENT_TARGET}"
          "-DEntropy_MACOS_CODESIGN_IDENTITY=${ENTROPY_MACOS_CODESIGN_IDENTITY}"


      - name: Build DMG and ZIP
        run: cmake --build --preset package-release --parallel "${CMAKE_BUILD_PARALLEL_LEVEL}"

      - name: Smoke-test staged install
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
        run: |
          cmake --install build-release --prefix build-release/macos-package-install
          python3 .github/scripts/verify_macos_icon_assets.py build-release/macos-package-install/Entropy.app/Contents/Resources/Assets.car
          build-release/macos-package-install/Entropy.app/Contents/MacOS/entropy --help

      - name: Reclaim space for notarization
        run: |
          df -h .
          du -sh build-release/bin build-release/app build-release/lib build-release/test build-release/macos-package-install
          rm -rf -- build-release/bin build-release/app build-release/lib build-release/test build-release/macos-package-install
          df -h .

      - name: Notarize and staple macOS packages
        env:
          ENTROPY_NOTARY_API_KEY_ID: ${{ secrets.ENTROPY_NOTARY_API_KEY_ID }}
          ENTROPY_NOTARY_API_ISSUER_ID: ${{ secrets.ENTROPY_NOTARY_API_ISSUER_ID }}
        run: |
          bash .github/scripts/notarize_macos_packages.sh \
            "build-release/packages/Entropy-${ENTROPY_VERSION}-macOS-arm64.zip" \
            "build-release/packages/Entropy-${ENTROPY_VERSION}-macOS-arm64.dmg"

      - name: Remove signing credentials
        if: always()
        run: bash .github/scripts/cleanup_macos_release_credentials.sh

      - name: Locate release assets
        run: |
          package_dir="build-release/packages"
          dmg=$(find "$package_dir" -maxdepth 1 -type f -name "Entropy-${ENTROPY_VERSION}-macOS-*.dmg" | head -n 1)
          zip=$(find "$package_dir" -maxdepth 1 -type f -name "Entropy-${ENTROPY_VERSION}-macOS-*.zip" | head -n 1)

          if [[ -z "$dmg" ]]; then
            echo "DMG package was not found in $package_dir" >&2
            exit 1
          fi
          if [[ -z "$zip" ]]; then
            echo "ZIP package was not found in $package_dir" >&2
            exit 1
          fi

          {
            echo "DMG: $(basename "$dmg")"
            echo "ZIP: $(basename "$zip")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload macOS packages as workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: entropy-${{ env.ENTROPY_VERSION }}-macos-arm64
          path: |
            build-release/packages/Entropy-${{ env.ENTROPY_VERSION }}-macOS-*.dmg
            build-release/packages/Entropy-${{ env.ENTROPY_VERSION }}-macOS-*.zip
          if-no-files-found: error

      - name: Show Release ccache stats
        if: always()
        run: ccache --show-stats

  macos-x86_64:
    name: macOS Release (x86_64)
    runs-on: macos-15-intel
    needs: metadata
    environment: release-signing
    env:
      ENTROPY_VERSION: ${{ needs.metadata.outputs.entropy_version }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 2G
      ENTROPY_MACOS_ARCHITECTURES: x86_64
      ENTROPY_MACOS_DEPLOYMENT_TARGET: "13.3"
      ENTROPY_MACOS_SUPERBUILD_PARALLEL: 2

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install build dependencies
        run: brew install ccache

      - name: Validate runner tools
        run: |
          sw_vers
          test "$(uname -m)" = "x86_64"
          cmake --version
          cpack --version
          git --version
          ccache --version
          xcodebuild -version
          xcrun --show-sdk-version

      - name: Restore Release ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .ccache
          key: >-
            entropy-release-${{ env.DEPS_CACHE_VERSION }}-macos15-intel-x86_64-appleclang-ccache-${{ github.sha }}-${{
            hashFiles('CMakePresets.json', 'CMakeLists.txt', 'cmake/*.cmake', '.github/workflows/release.yml') }}

      - name: Reset Release ccache stats
        run: |
          ccache --max-size="${CCACHE_MAXSIZE}"
          ccache --zero-stats

      - name: Restore Release Dependencies cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            build-release/external/catch2-*
            build-release/external/cli11-*
            build-release/external/cmakerc-*
            build-release/external/glfw-*
            build-release/external/glm-*
            build-release/external/iconfont-*
            build-release/external/imgui-*
            build-release/external/implot-*
            build-release/external/itk-*
            build-release/external/vtk-*
            build-release/external/nanovg-*
            build-release/external/nativefiledialog-*
            build-release/external/nlohmann_json-*
            build-release/external/qtbase-*
            build-release/external/spdlog-*
            build-release/external/stduuid-*
            build-release/external/tinyfsm-*
          key: >-
            entropy-release-${{ env.DEPS_CACHE_VERSION }}-macos15-intel-x86_64-appleclang-deps-${{ github.sha }}-${{
            hashFiles('CMakePresets.json', 'CMakeLists.txt', 'cmake/*.cmake', '.github/workflows/release.yml') }}

      - name: Configure Release Dependencies
        run: >
          cmake --preset deps-release
          -DCMAKE_OSX_ARCHITECTURES="${ENTROPY_MACOS_ARCHITECTURES}"
          -DCMAKE_OSX_DEPLOYMENT_TARGET="${ENTROPY_MACOS_DEPLOYMENT_TARGET}"
          -DEntropy_SUPERBUILD_PARALLEL="${ENTROPY_MACOS_SUPERBUILD_PARALLEL}"
          -DEntropy_PACKAGE_ARCHITECTURE=x86_64

      - name: Build Release Dependencies
        run: cmake --build --preset deps-release --parallel 1

      - name: Configure Release app
        run: >
          cmake --preset app-release
          -DCMAKE_OSX_ARCHITECTURES="${ENTROPY_MACOS_ARCHITECTURES}"
          -DCMAKE_OSX_DEPLOYMENT_TARGET="${ENTROPY_MACOS_DEPLOYMENT_TARGET}"
          -DEntropy_PACKAGE_ARCHITECTURE=x86_64
          -DEntropy_MACOS_ICON_DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer
          -DEntropy_MACOS_CODESIGN_IDENTITY=-

      - name: Build Release app
        run: cmake --build --preset app-release --parallel "${CMAKE_BUILD_PARALLEL_LEVEL}"

      - name: Verify macOS dark icon
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
        run: python3 .github/scripts/verify_macos_icon_assets.py build-release/bin/Entropy.app/Contents/Resources/Assets.car

      - name: Run Release tests
        run: ctest --test-dir build-release --parallel "${CTEST_PARALLEL_LEVEL}" --output-on-failure

      - name: Validate deployment target
        run: otool -l build-release/bin/Entropy.app/Contents/MacOS/entropy | grep -A3 LC_BUILD_VERSION

      - name: Install Developer ID certificate and notarization key
        env:
          ENTROPY_MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.ENTROPY_MACOS_CERTIFICATE_P12_BASE64 }}
          ENTROPY_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.ENTROPY_MACOS_CERTIFICATE_PASSWORD }}
          ENTROPY_MACOS_CODESIGN_IDENTITY: ${{ secrets.ENTROPY_MACOS_CODESIGN_IDENTITY }}
          ENTROPY_NOTARY_API_KEY_BASE64: ${{ secrets.ENTROPY_NOTARY_API_KEY_BASE64 }}
          ENTROPY_NOTARY_API_KEY_ID: ${{ secrets.ENTROPY_NOTARY_API_KEY_ID }}
          ENTROPY_NOTARY_API_ISSUER_ID: ${{ secrets.ENTROPY_NOTARY_API_ISSUER_ID }}
        run: bash .github/scripts/setup_macos_release_credentials.sh

      - name: Configure Developer ID packaging
        env:
          ENTROPY_MACOS_CODESIGN_IDENTITY: ${{ secrets.ENTROPY_MACOS_CODESIGN_IDENTITY }}
        run: >
          cmake --preset app-release
          -DCMAKE_OSX_ARCHITECTURES="${ENTROPY_MACOS_ARCHITECTURES}"
          -DCMAKE_OSX_DEPLOYMENT_TARGET="${ENTROPY_MACOS_DEPLOYMENT_TARGET}"
          -DEntropy_PACKAGE_ARCHITECTURE=x86_64
          "-DEntropy_MACOS_CODESIGN_IDENTITY=${ENTROPY_MACOS_CODESIGN_IDENTITY}"


      - name: Build DMG and ZIP
        run: cmake --build --preset package-release --parallel "${CMAKE_BUILD_PARALLEL_LEVEL}"

      - name: Smoke-test staged install
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
        run: |
          cmake --install build-release --prefix build-release/macos-package-install
          python3 .github/scripts/verify_macos_icon_assets.py build-release/macos-package-install/Entropy.app/Contents/Resources/Assets.car
          build-release/macos-package-install/Entropy.app/Contents/MacOS/entropy --help

      - name: Reclaim space for notarization
        run: |
          df -h .
          du -sh build-release/bin build-release/app build-release/lib build-release/test build-release/macos-package-install
          rm -rf -- build-release/bin build-release/app build-release/lib build-release/test build-release/macos-package-install
          df -h .

      - name: Notarize and staple macOS packages
        env:
          ENTROPY_NOTARY_API_KEY_ID: ${{ secrets.ENTROPY_NOTARY_API_KEY_ID }}
          ENTROPY_NOTARY_API_ISSUER_ID: ${{ secrets.ENTROPY_NOTARY_API_ISSUER_ID }}
        run: |
          bash .github/scripts/notarize_macos_packages.sh \
            "build-release/packages/Entropy-${ENTROPY_VERSION}-macOS-x86_64.zip" \
            "build-release/packages/Entropy-${ENTROPY_VERSION}-macOS-x86_64.dmg"

      - name: Remove signing credentials
        if: always()
        run: bash .github/scripts/cleanup_macos_release_credentials.sh

      - name: Locate release assets
        run: |
          package_dir="build-release/packages"
          dmg=$(find "$package_dir" -maxdepth 1 -type f -name "Entropy-${ENTROPY_VERSION}-macOS-x86_64.dmg" | head -n 1)
          zip=$(find "$package_dir" -maxdepth 1 -type f -name "Entropy-${ENTROPY_VERSION}-macOS-x86_64.zip" | head -n 1)

          if [[ -z "$dmg" ]]; then
            echo "macOS x86_64 DMG package was not found in $package_dir" >&2
            exit 1
          fi
          if [[ -z "$zip" ]]; then
            echo "macOS x86_64 ZIP package was not found in $package_dir" >&2
            exit 1
          fi

          {
            echo "DMG: $(basename "$dmg")"
            echo "ZIP: $(basename "$zip")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload macOS x86_64 packages as workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: entropy-${{ env.ENTROPY_VERSION }}-macos-x86_64
          path: |
            build-release/packages/Entropy-${{ env.ENTROPY_VERSION }}-macOS-x86_64.dmg
            build-release/packages/Entropy-${{ env.ENTROPY_VERSION }}-macOS-x86_64.zip
          if-no-files-found: error

      - name: Show Release ccache stats
        if: always()
        run: ccache --show-stats

  fedora-x86_64:
    name: Fedora 43 Release (x86_64)
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    container:
      # Fedora 43 linux/amd64 image index, verified against Docker Hub.
      image: fedora:43@sha256:a651ddf48ea28a06ed4e1e6519f51c9f47e7a5a138722ade87369b8fbb7e5b42
    needs: metadata
    env:
      CC: gcc
      CXX: g++
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 2G
      ENTROPY_VERSION: ${{ needs.metadata.outputs.entropy_version }}
      FEDORA_PACKAGE_LABEL: Fedora

    steps:
      - name: Install build and packaging dependencies
        run: |
          dnf install -y \
            ccache \
            cmake \
            file \
            gcc \
            gcc-c++ \
            git \
            libX11-devel \
            libXcursor-devel \
            libXext-devel \
            libXfixes-devel \
            libXi-devel \
            libXinerama-devel \
            libXrandr-devel \
            dbus-devel \
            libglvnd-devel \
            openssl-devel \
            libglvnd-opengl \
            libxkbcommon-devel \
            make \
            mesa-libGL-devel \
            rpm-build \
            wayland-devel

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Validate runner tools
        run: |
          cat /etc/fedora-release
          cmake --version
          cpack --version
          git --version
          ccache --version
          "${CC}" --version
          "${CXX}" --version
          rpm --version
          rpmbuild --version

      - name: Restore Release ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .ccache
          key: >-
            entropy-release-${{ env.DEPS_CACHE_VERSION }}-linux-fedora43-gcc-ccache-${{ github.sha }}-${{
            hashFiles('CMakePresets.json', 'CMakeLists.txt', 'cmake/*.cmake', '.github/workflows/release.yml') }}

      - name: Reset Release ccache stats
        run: |
          ccache --max-size="${CCACHE_MAXSIZE}"
          ccache --zero-stats

      - name: Restore Release Dependencies cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            build-release/external/catch2-*
            build-release/external/cli11-*
            build-release/external/cmakerc-*
            build-release/external/curl-*
            build-release/external/glfw-*
            build-release/external/glm-*
            build-release/external/iconfont-*
            build-release/external/imgui-*
            build-release/external/implot-*
            build-release/external/itk-*
            build-release/external/vtk-*
            build-release/external/nanovg-*
            build-release/external/nativefiledialog-*
            build-release/external/nlohmann_json-*
            build-release/external/qtbase-*
            build-release/external/spdlog-*
            build-release/external/stduuid-*
            build-release/external/tinyfsm-*
          key: >-
            entropy-release-${{ env.DEPS_CACHE_VERSION }}-linux-fedora43-gcc-deps-${{ github.sha }}-${{
            hashFiles('CMakePresets.json', 'CMakeLists.txt', 'cmake/*.cmake', '.github/workflows/release.yml') }}

      - name: Configure Release Dependencies
        run: >-
          cmake --preset deps-release -DEntropy_SUPERBUILD_PARALLEL="$CMAKE_BUILD_PARALLEL_LEVEL"
          -DEntropy_LINUX_PACKAGE_PLATFORM_LABEL="${FEDORA_PACKAGE_LABEL}"
          "-DEntropy_LINUX_CPACK_GENERATORS=RPM;TGZ"

      - name: Build Release Dependencies
        run: cmake --build --preset deps-release --parallel "${CMAKE_BUILD_PARALLEL_LEVEL}"

      - name: Configure Release app
        run: >-
          cmake --preset app-release -DEntropy_LINUX_PACKAGE_PLATFORM_LABEL="${FEDORA_PACKAGE_LABEL}"
          "-DEntropy_LINUX_CPACK_GENERATORS=RPM;TGZ"

      - name: Build Release app
        run: cmake --build --preset app-release --parallel "${CMAKE_BUILD_PARALLEL_LEVEL}"

      - name: Run Release tests
        run: ctest --test-dir build-release --parallel "${CTEST_PARALLEL_LEVEL}" --output-on-failure

      - name: Build RPM and portable TAR.GZ
        run: cmake --build --preset package-release --parallel "${CMAKE_BUILD_PARALLEL_LEVEL}"

      - name: Inspect RPM package
        run: |
          rpm -qpi build-release/packages/Entropy-${ENTROPY_VERSION}-${FEDORA_PACKAGE_LABEL}-*.rpm
          rpm -qpl build-release/packages/Entropy-${ENTROPY_VERSION}-${FEDORA_PACKAGE_LABEL}-*.rpm
          rpm -qp --requires build-release/packages/Entropy-${ENTROPY_VERSION}-${FEDORA_PACKAGE_LABEL}-*.rpm \
            > rpm-requires.txt
          cat rpm-requires.txt
          if grep -E '^libQt6Core[.]so[.]6' rpm-requires.txt; then
            echo "RPM requires bundled Qt Core instead of using the packaged private library" >&2
            exit 1
          fi

      - name: Smoke-test staged install
        run: |
          cmake --install build-release --prefix build-release/fedora-package-install
          build-release/fedora-package-install/bin/entropy --help

      - name: Locate release assets
        run: |
          package_dir="build-release/packages"
          rpm=$(find "$package_dir" -maxdepth 1 -type f \
            -name "Entropy-${ENTROPY_VERSION}-${FEDORA_PACKAGE_LABEL}-*.rpm" | head -n 1)
          tarball=$(find "$package_dir" -maxdepth 1 -type f \
            -name "Entropy-${ENTROPY_VERSION}-${FEDORA_PACKAGE_LABEL}-*-portable.tar.gz" | head -n 1)

          if [[ -z "$rpm" ]]; then
            echo "RPM package was not found in $package_dir" >&2
            exit 1
          fi
          if [[ -z "$tarball" ]]; then
            echo "Portable TAR.GZ package was not found in $package_dir" >&2
            exit 1
          fi

          {
            echo "RPM: $(basename "$rpm")"
            echo "Portable TAR.GZ: $(basename "$tarball")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Fedora packages as workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: entropy-${{ env.ENTROPY_VERSION }}-fedora-x86_64
          path: |
            build-release/packages/Entropy-${{ env.ENTROPY_VERSION }}-Fedora-*.rpm
            build-release/packages/Entropy-${{ env.ENTROPY_VERSION }}-Fedora-*-portable.tar.gz
          if-no-files-found: error

      - name: Show Release ccache stats
        if: always()
        run: ccache --show-stats

  publish:
    name: Publish GitHub Release
    environment: release-publish
    permissions:
      contents: write
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    needs:
      - metadata
      - windows-x86_64
      - linux-x86_64
      - fedora-x86_64
      - macos-arm64
      - macos-x86_64
    env:
      ENTROPY_VERSION: ${{ needs.metadata.outputs.entropy_version }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: entropy-${{ env.ENTROPY_VERSION }}-*
          path: release-assets
          merge-multiple: true

      - name: Create source archives
        run: |
          prefix="Entropy-${ENTROPY_VERSION}/"
          git archive --format=zip --prefix="$prefix" -o "release-assets/Entropy-${ENTROPY_VERSION}-source.zip" HEAD
          git archive --format=tar.gz --prefix="$prefix" \
            -o "release-assets/Entropy-${ENTROPY_VERSION}-source.tar.gz" HEAD

      - name: Validate assets and generate SHA-256 checksums
        run: |
          python3 .github/scripts/prepare_release_assets.py generate \
            --version "$ENTROPY_VERSION" --asset-dir release-assets
          cat release-assets/SHA256SUMS.txt

      - name: Create release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          generated_notes="$(mktemp)"
          gh api \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            --method POST \
            --field tag_name="$tag" \
            --jq .body > "$generated_notes"

          cat > release-notes.md <<EOF
          ## Downloads

          - macOS Apple Silicon (arm64): \`Entropy-${ENTROPY_VERSION}-macOS-arm64.dmg\`
          - macOS Intel (x86_64): \`Entropy-${ENTROPY_VERSION}-macOS-x86_64.dmg\`
          - Windows x86_64: \`Entropy-${ENTROPY_VERSION}-Windows-x86_64.msi\`
          - Ubuntu x86_64: \`Entropy-${ENTROPY_VERSION}-Ubuntu-x86_64.deb\`
          - Fedora x86_64: \`Entropy-${ENTROPY_VERSION}-Fedora-x86_64.rpm\`
          - Portable archives are also attached for macOS, Windows, Ubuntu, and Fedora.
          - Source archives are attached as \`zip\` and \`tar.gz\`.

          ## Verify downloads

          Download \`SHA256SUMS.txt\` from this official release along with the files you need.
          It covers all attached installers, portable archives, and named source archives.
          From the download directory, check files with:

          - Linux: \`sha256sum --check --ignore-missing SHA256SUMS.txt\`
          - macOS: \`shasum -a 256 <downloaded-file>\`, then compare with its manifest entry.
          - Windows PowerShell: \`Get-FileHash .\\<downloaded-file> -Algorithm SHA256\`,
            then compare with its manifest entry (letter case does not matter).

          Use the named \`Entropy-${ENTROPY_VERSION}-source.*\` archives for checksum-verified source;
          GitHub's automatic "Source code" links are separate, generated downloads.
          A matching checksum confirms file integrity, not that a third-party download site is trustworthy.

          ## System requirements

          - Windows 10 version 1809 or later (x86_64)
          - macOS 13.3 or later (Apple Silicon or Intel)
          - Ubuntu 22.04 or later (x86_64)
          - Fedora 43 or later (x86_64)

          ## Notes

          - On Ubuntu, install the \`.deb\` with
            \`sudo apt install ./Entropy-${ENTROPY_VERSION}-Ubuntu-x86_64.deb\`,
            so that package dependencies get resolved automatically. Do not use \`dpkg -i\`.
          - The platform installer/package is intended for normal use, whereas the
            portable archives are for manual installs and testing.
          - The registration backends (ANTs, FireANTs, and Greedy) must be installed separately.

          EOF
          cat "$generated_notes" >> release-notes.md

      - name: Upload and verify draft, then publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release '$tag' already exists. Use a new version/tag, or remove an unpublished draft before retrying." >&2
            exit 1
          fi

          remote_commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/$tag" --jq .sha)"
          test "$remote_commit" = "$GITHUB_SHA"
          python3 .github/scripts/prepare_release_assets.py verify \
            --version "$ENTROPY_VERSION" --asset-dir release-assets

          gh release create "$tag" \
            release-assets/* \
            --draft \
            --verify-tag \
            --notes-file release-notes.md \
            --title "Entropy $ENTROPY_VERSION"

          release_id="$(gh release view "$tag" --json databaseId --jq .databaseId)"
          uploaded_assets="$RUNNER_TEMP/entropy-uploaded-assets.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases/$release_id/assets?per_page=100" > "$uploaded_assets"
          python3 .github/scripts/prepare_release_assets.py verify-upload \
            --version "$ENTROPY_VERSION" --asset-dir release-assets \
            --uploaded-assets-json "$uploaded_assets"

          remote_commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/$tag" --jq .sha)"
          test "$remote_commit" = "$GITHUB_SHA"
          gh release edit "$tag" --draft=false --latest
          immutable="$(gh api "repos/${GITHUB_REPOSITORY}/releases/$release_id" --jq .immutable)"
          if [[ "$immutable" != "true" ]]; then
            echo "Release was not locked. Enable repository release immutability before publishing." >&2
            exit 1
          fi
